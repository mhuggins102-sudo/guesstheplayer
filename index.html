<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess The Player - MLB</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="header__title">Guess The Player</h1>
      <p class="header__subtitle">MLB Edition</p>
      <button class="leaderboard-btn" id="leaderboard-btn" aria-label="View practice stats" title="Practice Stats">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>
      </button>
    </header>

    <nav class="controls">
      <div class="controls__modes">
        <button class="btn btn--mode btn--active" data-mode="practice">Practice</button>
        <button class="btn btn--mode" data-mode="daily">Daily</button>
      </div>
      <div class="controls__filters">
        <select id="era-select" class="select" aria-label="Era filter">
          <option value="all">All-Time</option>
          <option value="1940">1940+</option>
          <option value="1960">1960+</option>
          <option value="1980">1980+</option>
          <option value="2000" selected>2000+</option>
          <option value="active">Active</option>
        </select>
        <select id="difficulty-select" class="select" aria-label="Difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
    </nav>

    <div class="search">
      <div class="search__wrapper">
        <input
          type="text"
          id="player-input"
          class="search__input"
          placeholder="Type a player name..."
          autocomplete="off"
          aria-label="Search for a player"
          aria-autocomplete="list"
          aria-controls="autocomplete-list"
        >
        <ul id="autocomplete-list" class="autocomplete" role="listbox" aria-label="Player suggestions"></ul>
      </div>
    </div>

    <section class="guesses" aria-label="Your guesses">
      <div class="guesses__header" id="guesses-header"></div>
      <div class="guesses__rows" id="guesses-rows"></div>
    </section>

    <div class="hint-banner hidden" id="hint-banner"></div>

    <div class="game-actions">
      <button class="btn btn--hint hidden" id="hint-btn">Hint</button>
      <button class="btn btn--give-up hidden" id="give-up-btn">Give Up</button>
      <button class="btn btn--new-game hidden" id="new-game-btn">New Game</button>
    </div>

    <div class="result hidden" id="result-panel">
      <div class="result__content">
        <h2 class="result__title" id="result-title"></h2>
        <p class="result__answer" id="result-answer"></p>
        <p class="result__stats" id="result-stats"></p>
        <button class="btn btn--share" id="share-btn">Share Results</button>
      </div>
    </div>
  </div>

    <!-- Player Card Modal -->
    <div class="modal-overlay hidden" id="player-card-modal">
      <div class="modal player-card">
        <button class="modal__close" id="player-card-close" aria-label="Close">&times;</button>
        <div class="player-card__body" id="player-card-body"></div>
      </div>
    </div>

    <!-- Leaderboard Modal -->
    <div class="modal-overlay hidden" id="leaderboard-modal">
      <div class="modal">
        <div class="modal__header">
          <h2 class="modal__title">Practice Stats</h2>
          <button class="modal__close" id="leaderboard-close" aria-label="Close">&times;</button>
        </div>
        <div class="modal__body" id="leaderboard-content"></div>
      </div>
    </div>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
  <script src="js/autocomplete.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
